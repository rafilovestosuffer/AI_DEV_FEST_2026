name: App CI & Engine Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Web App — Tests, Lint, Type-check, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run full engine + app test suite (102 tests)
        run: bun test tests/sathi-engines.test.ts tests/sathi-ml.test.ts tests/sathi-app.test.ts tests/sathi-openrouter.test.ts tests/sathi-actions.test.ts

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:../db/custom.db
